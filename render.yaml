services:
  - type: web
    name: sesh
    runtime: node
    plan: free
    # --include=dev is required even though NODE_ENV=production is set below —
    # otherwise npm skips devDependencies (vite, typescript) that the build needs.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — set the values in the Render dashboard, never in this file.
      - key: YOUTUBE_API_KEY
        sync: false
      # Accounts. All three absent, the app runs without sign-in at all.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false

  # Staging: the same app, deployed from the `staging` branch, with its own
  # secrets (a separate Neon database branch, so tests never touch real
  # accounts). Every change lands here first and is merged into main once it
  # has been tried at staging.dhairya.cloud.
  - type: web
    name: sesh-staging
    runtime: node
    plan: free
    branch: staging
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Marks the deploy so the app can say which one it is (a badge in the
      # web client, the environment in /api/health).
      - key: SESH_ENV
        value: staging
      - key: YOUTUBE_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
